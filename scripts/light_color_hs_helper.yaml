# Companion script for the IKEA BILRESA scroll wheel blueprint.
# The blueprint's `lights: color hue only` scroll branch calls script.light_color_hs_helper.
# Create it in Home Assistant: Settings > Automations & Scenes > Scripts > Add Script >
# (three-dot menu) Edit in YAML > paste the block below.
#
# Behaviour: reads the light's current hs_color, rotates the hue by ±color_hue_step
# (mod 360) and writes hue + color_saturation back with a transition.
#
# Saturation comes from the input, NOT from the light's current saturation: a 15 degree
# step at low saturation (e.g. 34%) is visually imperceptible, so reuse of the current
# value makes the scroll look broken.

light_color_hs_helper:
  alias: light_color_hs_helper
  description: >-
    Rotate a light's hue one step. Companion script for the IKEA BILRESA scroll wheel
    blueprint (its colour-hue scroll branches call script.light_color_hs_helper).
  mode: queued
  max: 30
  fields:
    target_light:
      required: true
      selector:
        entity:
          domain: light
          multiple: false
    mode:
      default: up
      selector:
        select:
          options:
            - up
            - down
    color_hue_step:
      default: 15
      description: Step in degrees.
      selector:
        number:
          min: 1
          max: 90
    color_saturation:
      default: 100
      selector:
        number:
          min: 1
          max: 100
    light_transition_duration:
      default: 0.5
      selector:
        number:
          min: 0
          max: 10
          step: 0.05
          unit_of_measurement: s
  sequence:
    - variables:
        cur: "{{ state_attr(target_light, 'hs_color') }}"
        h: "{{ (cur[0] if cur is not none else 0) | float(0) }}"
        s: "{{ color_saturation | float(100) }}"
    - variables:
        new_hue: "{{ (h + (color_hue_step | float(15)) * (1 if mode == 'up' else -1)) % 360 }}"
    - action: light.turn_on
      target:
        entity_id: "{{ target_light }}"
      data:
        hs_color:
          - "{{ new_hue | float | round(1) }}"
          - "{{ s | float | round(1) }}"
        transition: "{{ light_transition_duration | float(0.5) }}"
